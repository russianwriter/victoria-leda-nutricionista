  <path d="M140 340v18a18 18 0 0 0 18 18" stroke="#1C6B3C" stroke-width="9" stroke-linecap="round" />
  <circle cx="246" cy="452" r="18" fill="#E63946" stroke="#1C6B3C" stroke-width="8" />

